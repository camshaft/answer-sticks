name: Source hashes, PCF8574 and hd44780 (temporary)

# Downloads the PCF8574A data sheets from TI, NXP and the Wayback Machine's copy of NXP's, for
# the lines of docs/sources/README.md. This branch never merges.
on:
  push:
    branches: [sources-pcf8574-hash]

permissions:
  contents: read

jobs:
  pcf8574a:
    runs-on: ubuntu-latest
    steps:
      - name: Install pdfinfo and pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Hash the data sheets
        run: |
          set -u
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          fetch() {
            name=$1; url=$2
            for attempt in 1 2 3; do
              echo "=== $name $url attempt $attempt"
              rm -f headers.txt "$name.pdf"
              if curl -sSfL -A "$ua" -D headers.txt -o "$name.pdf" -w 'effective: %{url_effective}\n' "$url"; then
                grep -iE '^(HTTP|content-type|content-length|last-modified|etag|memento-datetime|x-archive-orig-last-modified|x-archive-orig-content-length):' headers.txt || true
                echo "bytes: $(stat -c %s "$name.pdf")"
                pdfinfo "$name.pdf" | grep -E '^(Title|Author|Producer|Creator|CreationDate|ModDate|Pages):' || true
                echo "sha256: $(sha256sum "$name.pdf" | cut -d' ' -f1)"
                return 0
              fi
              echo "download failed"
              rm -f "$name.pdf"
              sleep 20
            done
          }
          fetch tia https://www.ti.com/lit/ds/symlink/pcf8574a.pdf
          fetch nxpcn https://www.nxp.com.cn/docs/en/data-sheet/PCF8574_PCF8574A.pdf
          fetch nxparchive https://web.archive.org/web/20250101000000id_/https://www.nxp.com/docs/en/data-sheet/PCF8574_PCF8574A.pdf
          for f in tia nxpcn nxparchive; do
            [ -f "$f.pdf" ] || continue
            n=$(pdfinfo "$f.pdf" | awk '/^Pages:/ {print $2}')
            for p in $(seq 1 "$n"); do
              out=$(pdftotext -layout -f "$p" -l "$p" "$f.pdf" - | grep -nE 'SCPS0|REVISED|100 kHz|Rev\. ?[0-9]+ .*20[0-9][0-9]|Product data sheet|Supply voltage|VCC  |VDD  |fscl|fSCL|SCL clock frequency|address map|Address Reference|0111|[0-9A-F]h  |Table (4|5|9|10)\.' || true)
              if [ -n "$out" ]; then echo "--- $f page $p"; echo "$out"; fi
            done
          done
