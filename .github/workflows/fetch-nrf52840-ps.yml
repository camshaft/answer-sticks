name: Fetch the nRF52840 Product Specification

# A temporary workflow: it runs on pushes to this branch alone, downloads revision 1.11 of the
# specification as Nordic's documentation site served it, and prints its SHA-256 and its text,
# each line after its page number. The branch removes it before its pull request merges.
#
# Nordic's site answers automated reads with a Cloudflare challenge, so the file comes from the
# Internet Archive's capture of Nordic's own URL, in its raw form (the id_ flag), and the step
# checks the file's SHA-1 against the digest the Archive's index lists for every capture of that
# URL from 2025-02-07 to 2025-10-10.
on:
  push:
    branches: [nrf52840-ps-source]

permissions:
  contents: read

jobs:
  fetch:
    name: Download the specification, hash it and print its text
    runs-on: ubuntu-latest
    steps:
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Download revision 1.11 as Nordic's documentation site served it
        run: |
          nordic='https://docs-be.nordicsemi.com/bundle/ps_nrf52840/attach/nRF52840_PS_v1.11.pdf?_LANG=enus'
          curl -fsSL -o ps.pdf "https://web.archive.org/web/20250825153625id_/$nordic"
          echo "magic: $(head -c 5 ps.pdf)"
          digest=$(python3 -c "import base64, hashlib; print(base64.b32encode(hashlib.sha1(open('ps.pdf', 'rb').read()).digest()).decode())")
          echo "SHA-1 in base32: $digest"
          test "$digest" = 57POWQZB6QHXZOI2RWLGZFE3KOCAVCMO
          sha256sum ps.pdf
          ls -l ps.pdf
          pdfinfo ps.pdf
      - name: Print the text, each line after its page number
        run: |
          pdftotext -layout ps.pdf ps.txt
          awk 'BEGIN { page = 1 } { n = split($0, parts, "\f"); for (i = 1; i <= n; i++) { if (i > 1) page++; print "p" page ": " parts[i] } }' ps.txt
