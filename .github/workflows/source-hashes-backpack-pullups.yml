name: Source hashes, LCD backpack pull-ups (temporary)

# Renders the seller's schematic of the PCF8574 LCD backpack as PNG pictures and commits
# them to this branch, so that its resistor labels can be read by eye, for the line of
# docs/sources/README.md on the backpack's SDA and SCL pull-ups. This branch never merges.
on:
  push:
    branches: [sources-backpack-pullups-hash]
    paths: ['.github/workflows/**']

permissions:
  contents: write

jobs:
  schematics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Render the schematic
        run: |
          set -u
          curl -sSfL -o hv.pdf "https://github.com/HvandeVen/PCF8574-Display/raw/master/I2C%20LCD%20Adapter%20Schematic.pdf"
          echo "sha256: $(sha256sum hv.pdf | cut -d' ' -f1)"
          pdfinfo hv.pdf | grep -E '^(Page size|Pages):' || true
          mkdir -p renders
          pdftoppm -r 150 -gray -png -singlefile hv.pdf renders/whole-150dpi
          # The left, middle and right thirds of the page at 400 dpi.
          read -r w h < <(pdfinfo hv.pdf | awk '/^Page size/ {print int($3*400/72), int($5*400/72)}')
          third=$((w / 3 + 200))
          for i in 0 1 2; do
            x=$((i * w / 3 - (i > 0 ? 100 : 0)))
            [ "$x" -lt 0 ] && x=0
            pdftoppm -r 400 -gray -png -singlefile -x "$x" -y 0 -W "$third" -H "$h" hv.pdf "renders/part$i-400dpi"
          done
          ls -l renders
      - name: Commit the pictures to this branch
        run: |
          git config user.name "source-hashes"
          git config user.email "source-hashes@users.noreply.github.com"
          git add renders
          git commit -m "Pictures of the seller's backpack schematic, for reading its resistor labels (temporary, never merges)"
          git push origin HEAD:sources-backpack-pullups-hash
